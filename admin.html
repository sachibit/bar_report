<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BAR REPORT 管理画面</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1c1917;--charcoal:#2c2825;--warm:#44403c;--muted:#78716c;--stone:#a8a29e;--silk:#e7e0d8;--rice:#f5f0ea;--paper:#faf7f4;--white:#fff;--sage:#7c9a84;--matcha:#5c7a62;--terra:#c4714a;--gold:#b5924a;--border:rgba(44,40,37,.1);--shadow:0 2px 20px rgba(28,25,23,.08)}
html,body{min-height:100%;overflow-x:hidden}
body{font-family:'DM Sans','Noto Serif JP',sans-serif;background:var(--rice);color:var(--ink);display:flex;flex-direction:column;align-items:center;padding-bottom:80px}
.hdr{width:100%;background:var(--charcoal);padding:22px 28px 20px;display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:32px}
.hdr-sub{font-size:10px;color:var(--stone);letter-spacing:.25em;text-transform:uppercase;margin-bottom:3px}
.hdr-title{font-family:'Noto Serif JP',serif;font-weight:300;font-size:20px;color:var(--paper);letter-spacing:.15em}
.hdr-date{font-size:11px;color:var(--stone);letter-spacing:.08em}
.card{width:100%;max-width:560px;padding:0 20px;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.ci{background:var(--white);border-radius:16px;padding:28px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:16px}
.stag{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.stag::before{content:'';display:block;width:14px;height:1px;background:var(--stone)}
.qlabel{font-family:'Noto Serif JP',serif;font-size:20px;font-weight:400;color:var(--ink);line-height:1.6;margin-bottom:5px}
.qhint{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.6}
input[type=text],input[type=password],input[type=month]{width:100%;padding:13px 15px;background:var(--paper);border:1.5px solid var(--silk);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:16px;color:var(--ink);outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none}
input:focus{border-color:var(--charcoal);background:var(--white)}
input::placeholder{color:var(--stone)}
.bp{width:100%;padding:15px;background:var(--charcoal);color:var(--paper);border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;letter-spacing:.08em;cursor:pointer;margin-top:16px;transition:all .2s}
.bp:hover{background:var(--ink)}.bp:disabled{opacity:.35;cursor:not-allowed}
.bs{width:100%;padding:13px;background:none;color:var(--muted);border:1.5px solid var(--silk);border-radius:12px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;margin-top:9px;transition:all .2s}
.bs:hover{border-color:var(--stone);color:var(--warm)}
.bsage{width:100%;padding:13px;background:var(--sage);color:#fff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;margin-top:10px;transition:all .2s}
.bsage:hover{background:var(--matcha)}
.err{color:var(--terra);font-size:13px;margin-top:10px;min-height:18px;text-align:center}
.stitle{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.stitle::after{content:'';flex:1;height:1px;background:var(--silk)}
.tblwrap{overflow-x:auto}
table.adm{width:100%;border-collapse:collapse;font-size:13px}
table.adm th{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.06em;text-align:right;padding:7px 8px;border-bottom:1.5px solid var(--silk);white-space:nowrap}
table.adm th:first-child,table.adm td:first-child{text-align:left}
table.adm td{padding:9px 8px;border-bottom:1px solid var(--rice);text-align:right;white-space:nowrap;color:var(--warm)}
table.adm td:first-child{font-weight:500;color:var(--ink)}
table.adm tr.total td{border-top:1.5px solid var(--silk);border-bottom:none;font-weight:600;color:var(--ink)}
table.adm td.left{text-align:left;white-space:normal}
.empty{font-size:13px;color:var(--stone);text-align:center;padding:18px 0}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.toolbar input[type=month]{flex:1}
.icon-btn{flex-shrink:0;padding:12px 14px;background:var(--white);border:1.5px solid var(--silk);border-radius:10px;font-size:14px;color:var(--warm);cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.icon-btn:hover{border-color:var(--stone)}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--paper);border:1.5px solid var(--silk);border-radius:10px;margin-bottom:7px}
.mrow.hidden-m{opacity:.55}
.mname{font-size:14px;font-weight:500;color:var(--ink);flex:1}
.myomi{font-size:11px;color:var(--stone)}
.mtoggle{padding:6px 12px;border-radius:20px;font-size:12px;border:1.5px solid var(--silk);background:var(--white);color:var(--muted);cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;white-space:nowrap}
.mtoggle.on{border-color:var(--sage);background:var(--sage);color:#fff}
.addform{display:flex;gap:8px;margin-top:12px}
.addform input{flex:1;padding:10px 12px!important;font-size:14px!important}
.addform button{flex-shrink:0;padding:10px 16px;background:var(--charcoal);color:var(--paper);border:none;border-radius:10px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif}
.note{font-size:11px;color:var(--stone);line-height:1.7;margin-top:8px}
.loading{text-align:center;color:var(--muted);font-size:13px;padding:30px 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--charcoal);color:var(--paper);padding:11px 22px;border-radius:50px;font-size:12px;letter-spacing:.08em;transition:transform .3s;z-index:999;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:400px){.ci{padding:22px 16px}}
</style>
</head>
<body>
<div class="hdr">
  <div><div class="hdr-sub">Admin</div><div class="hdr-title">管理画面</div></div>
  <div class="hdr-date" id="hdate"></div>
</div>
<div class="card" id="card"><div class="loading">読み込み中…</div></div>
<div class="toast" id="toast"></div>

<script>
// ══ 設定 ══════════════════════════════════════════════
// gas/admin.gs をデプロイしたウェブアプリURLを貼る（index.html と同じ値）
const ADMIN_GAS_URL = 'https://script.google.com/macros/s/AKfycbwefFzMgcp_5UlkNyeTcIvjU-sULoVdRcCNmRHxIV2XtwkodE2AzX8ehJGBaE5rTIG-Xw/exec';

// ══ 状態 ══════════════════════════════════════════════
let PASS = sessionStorage.getItem('bar_admin_pass') || '';
let REPORTS = [];   // 日報全行
let MEMBERS = [];   // {name,yomi,active}
let MONTH = (()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;})();

// ══ ユーティリティ ════════════════════════════════════
const cn = n=>Number(n||0).toLocaleString('ja-JP');
function shToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

// JSONP 呼び出し（GAS は CORS 制限があるため index.html と同じ方式）
function api(params){
  return new Promise((res,rej)=>{
    const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e5);
    const q=Object.entries({...params,callback:cb}).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
    const s=document.createElement('script');
    const t=setTimeout(()=>{clean();rej(new Error('timeout'));},15000);
    function clean(){clearTimeout(t);delete window[cb];s.remove();}
    window[cb]=d=>{clean();(d&&d.error)?rej(new Error(d.error)):res(d);};
    s.src=ADMIN_GAS_URL+'?'+q;
    s.onerror=()=>{clean();rej(new Error('network'));};
    document.body.appendChild(s);
  });
}

// シートの列位置で参照（A=0, B=1, …）。日報アプリの送信列順に対応:
// A=店舗 / B=日付 / C=担当 / D=組数 / H=売上合計 / U=発注内容
const COL={shop:0,date:1,staff:2,groups:3,totalSales:7,orders:20};
const f=(row,key)=>row[COL[key]];

// 日付を yyyy-mm-dd に正規化（「2026年7月8日」「2026-07-08」「ISO文字列」対応）
function isoDate(v){
  if(!v)return null;
  const s=String(v);
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  const d=new Date(s);if(!isNaN(d))return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return null;
}
function fdDisp(iso){if(!iso)return '―';const[,m,d]=iso.split('-');return `${+m}/${+d}`;}

// 選択中の月の日報のみ（日付昇順）。日付がパースできない行（ヘッダー等）は除外
function monthReports(){
  return REPORTS
    .map(r=>({row:r,_date:isoDate(f(r,'date'))}))
    .filter(x=>x._date&&x._date.startsWith(MONTH))
    .sort((a,b)=>a._date<b._date?-1:1);
}

// ══ 画面 ══════════════════════════════════════════════
function render(html){
  const c=document.getElementById('card');
  const inner=document.createElement('div');
  inner.innerHTML=html;
  c.innerHTML='';while(inner.firstChild)c.appendChild(inner.firstChild);
}

function renderSetup(){render(`
  <div class="ci">
    <div class="stag">セットアップが必要です</div>
    <div class="qlabel">管理用APIが<br>未設定です</div>
    <div class="qhint" style="margin-top:10px">
      リポジトリ内の <b>gas/admin.gs</b> の手順に従って Google Apps Script をデプロイし、
      発行されたウェブアプリURLをこのファイル（admin.html）と index.html の
      <b>ADMIN_GAS_URL</b> に貼り付けてください。
    </div>
  </div>`);}

function renderLogin(msg){render(`
  <div class="ci">
    <div class="stag">ログイン</div>
    <div class="qlabel">パスワードを<br>入力してください</div>
    <div style="margin-top:16px"><input type="password" id="ipass" placeholder="パスワード" onkeydown="if(event.key==='Enter')login()"></div>
    <button class="bp" id="loginbtn" onclick="login()">ログイン →</button>
    <div class="err" id="loginerr">${msg||''}</div>
  </div>`);
  setTimeout(()=>document.getElementById('ipass')?.focus(),50);
}

async function login(){
  const pass=document.getElementById('ipass')?.value||'';
  if(!pass){document.getElementById('loginerr').textContent='パスワードを入力してください';return;}
  const btn=document.getElementById('loginbtn');btn.disabled=true;btn.textContent='確認中…';
  try{
    await api({mode:'login',pass});
    PASS=pass;sessionStorage.setItem('bar_admin_pass',pass);
    await loadAll();
  }catch(e){
    btn.disabled=false;btn.textContent='ログイン →';
    document.getElementById('loginerr').textContent=e.message==='auth'?'パスワードが違います':'通信エラー：'+e.message;
  }
}
function logout(){PASS='';sessionStorage.removeItem('bar_admin_pass');renderLogin();}

async function loadAll(){
  render('<div class="loading">データを読み込んでいます…</div>');
  try{
    const [r,m]=await Promise.all([api({mode:'reports',pass:PASS}),api({mode:'allMembers',pass:PASS})]);
    REPORTS=r.reports||[];MEMBERS=m.members||[];
    renderDash();
  }catch(e){
    if(e.message==='auth'){logout();renderLogin('パスワードの有効期限が切れました。再ログインしてください');}
    else render(`<div class="ci"><div class="err">データを取得できませんでした：${e.message}</div><button class="bs" onclick="loadAll()">再読み込み</button><button class="bs" onclick="logout()">ログアウト</button></div>`);
  }
}

// ── 集計 ──────────────────────────────────────────────
function aggShops(rows){
  const map={};
  rows.forEach(x=>{
    const shop=String(f(x.row,'shop')||'不明');
    if(!map[shop])map[shop]={sales:0,groups:0,days:0};
    map[shop].sales+=Number(f(x.row,'totalSales'))||0;
    map[shop].groups+=Number(f(x.row,'groups'))||0;
    map[shop].days++;
  });
  const order=['昼雨','夜雨','々'];
  return Object.entries(map).sort((a,b)=>{
    const ia=order.indexOf(a[0]),ib=order.indexOf(b[0]);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
}
function aggStaff(rows){
  const map={};
  rows.forEach(x=>{
    const names=String(f(x.row,'staff')||'').split('・').map(s=>s.trim()).filter(Boolean);
    if(!names.length)return;
    const sales=Number(f(x.row,'totalSales'))||0;
    names.forEach(n=>{
      if(!map[n])map[n]={days:0,split:0,full:0};
      map[n].days++;map[n].split+=sales/names.length;map[n].full+=sales;
    });
  });
  return Object.entries(map).sort((a,b)=>b[1].split-a[1].split);
}

// ── ダッシュボード ────────────────────────────────────
function renderDash(){
  const rows=monthReports();
  const [y,mo]=MONTH.split('-');

  // 店舗別
  const shops=aggShops(rows);
  const shopTot=shops.reduce((a,[,v])=>({sales:a.sales+v.sales,groups:a.groups+v.groups,days:a.days+v.days}),{sales:0,groups:0,days:0});
  const shopH=shops.length?`
    <div class="tblwrap"><table class="adm">
      <tr><th>店舗</th><th>売上累計</th><th>来店組数</th><th>営業日数</th></tr>
      ${shops.map(([s,v])=>`<tr><td>${s}</td><td>${cn(v.sales)}円</td><td>${cn(v.groups)}組</td><td>${v.days}日</td></tr>`).join('')}
      <tr class="total"><td>合計</td><td>${cn(shopTot.sales)}円</td><td>${cn(shopTot.groups)}組</td><td>${shopTot.days}日</td></tr>
    </table></div>`:`<div class="empty">この月の日報はまだありません</div>`;

  // スタッフ別
  const staff=aggStaff(rows);
  const staffH=staff.length?`
    <div class="tblwrap"><table class="adm">
      <tr><th>スタッフ</th><th>出勤</th><th>均等按分</th><th>全額計上</th><th>1日あたり</th></tr>
      ${staff.map(([n,v])=>`<tr><td>${n}</td><td>${v.days}日</td><td>${cn(Math.round(v.split))}円</td><td>${cn(v.full)}円</td><td>${cn(Math.round(v.full/v.days))}円</td></tr>`).join('')}
      <tr class="total"><td>合計</td><td>―</td><td>${cn(Math.round(staff.reduce((a,[,v])=>a+v.split,0)))}円</td><td>―</td><td>―</td></tr>
    </table></div>
    <div class="note">均等按分＝日の売上を出勤人数で割って計上（合計は月の総売上と一致）。全額計上＝出勤した日の売上をそのまま計上（複数人の日は重複するため合計は表示しません）。1日あたり＝全額計上÷出勤日数（その子が出勤した日の平均売上）。</div>`
    :`<div class="empty">この月の日報はまだありません</div>`;

  // 発注履歴（日付降順・U列参照）
  const ordRows=[...rows].reverse().map(x=>{
    const o=String(f(x.row,'orders')||'なし');
    return `<tr><td>${fdDisp(x._date)}</td><td>${String(f(x.row,'shop')||'')}</td><td class="left">${o}</td></tr>`;
  }).join('');
  const ordH=rows.length?`
    <div class="tblwrap"><table class="adm">
      <tr><th>日付</th><th>店舗</th><th style="text-align:left">発注内容</th></tr>${ordRows}
    </table></div>`:`<div class="empty">この月の日報はまだありません</div>`;

  // メンバー管理
  const memH=MEMBERS.map(m=>`
    <div class="mrow ${m.active?'':'hidden-m'}">
      <span class="mname">${m.name} <span class="myomi">${m.yomi||''}</span></span>
      <button class="mtoggle ${m.active?'on':''}" onclick="toggleMember('${m.name.replace(/'/g,"\\'")}',${m.active?0:1})">${m.active?'表示中':'非表示'}</button>
    </div>`).join('');

  render(`
  <div class="ci">
    <div class="toolbar">
      <input type="month" id="imonth" value="${MONTH}" onchange="MONTH=this.value;renderDash()">
      <button class="icon-btn" onclick="loadAll()" title="再読み込み">↻</button>
      <button class="icon-btn" onclick="logout()">ログアウト</button>
    </div>
    <div class="qhint" style="margin-bottom:0">${+y}年${+mo}月の集計（日報 ${rows.length}件）</div>
  </div>
  <div class="ci"><div class="stitle">店舗別 月間売上累計</div>${shopH}</div>
  <div class="ci"><div class="stitle">スタッフ別 売上・出勤</div>${staffH}</div>
  <div class="ci"><div class="stitle">発注履歴</div>${ordH}</div>
  <div class="ci"><div class="stitle">メンバー管理</div>
    ${memH||'<div class="empty">メンバーがいません</div>'}
    <div class="addform">
      <input type="text" id="mname" placeholder="名前">
      <input type="text" id="myomi" placeholder="よみがな">
      <button onclick="addMember()">追加</button>
    </div>
    <div class="note">追加したメンバーは日報入力の担当者候補に自動で反映されます。「非表示」にすると候補から消えますが、過去の集計には残ります。</div>
  </div>`);
}

async function addMember(){
  const name=document.getElementById('mname')?.value.trim()||'';
  const yomi=document.getElementById('myomi')?.value.trim()||'';
  if(!name){shToast('名前を入力してください');return;}
  try{
    await api({mode:'addMember',pass:PASS,name,yomi});
    const m=await api({mode:'allMembers',pass:PASS});
    MEMBERS=m.members||[];renderDash();shToast(`${name} を追加しました`);
  }catch(e){shToast('追加できませんでした：'+e.message);}
}

async function toggleMember(name,active){
  try{
    await api({mode:'setMemberActive',pass:PASS,name,active});
    const m=MEMBERS.find(x=>x.name===name);if(m)m.active=active;
    renderDash();shToast(active?`${name} を表示に戻しました`:`${name} を非表示にしました`);
  }catch(e){shToast('変更できませんでした：'+e.message);}
}

// ══ 起動 ══════════════════════════════════════════════
(function init(){
  const now=new Date();
  document.getElementById('hdate').textContent=`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
  if(!ADMIN_GAS_URL){renderSetup();return;}
  if(PASS)loadAll();else renderLogin();
})();
</script>
</body>
</html>
